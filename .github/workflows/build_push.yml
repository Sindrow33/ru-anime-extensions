name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  # Manual trigger
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 15
  IS_PR_CHECK: false

jobs:
  prepare:
    permissions:
      contents: write
    name: Prepare job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latestCommitMessage: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      delete: ${{ steps.generate-matrices.outputs.delete }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set env
        id: set-env
        run: |
          echo "LATEST_COMMIT_MESSAGE<<{delimiter}
          $(git log -1 --pretty=%B)

          Built on commit: $(git log -1 --pretty=%H)
          {delimiter}" >> $GITHUB_OUTPUT

      - name: Find lib changes
        id: modified-libs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: lib/
          files_ignore: lib/**.md
          files_separator: " "
          safe_output: false

      - name: Push last-built commit to repo branch
        if: steps.modified-libs.outputs.any_changed == 'true'
        run: |
          git fetch origin repo:repo
          LAST_REPO_COMMIT_MESSAGE=$(git log -1 --pretty=%B repo)
          if [[ "$LAST_REPO_COMMIT_MESSAGE" == *"skip-ci"* ]]; then
            LAST_REPO_COMMIT=$(git rev-parse repo)
          else
            LAST_REPO_COMMIT=$(git log --format=%H --grep="Built on commit" -1 repo | head -1)
          fi
          LAST_MAIN_COMMIT=$(git rev-parse HEAD)
          if [ "$LAST_REPO_COMMIT" != "$LAST_MAIN_COMMIT" ]; then
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git push -f origin HEAD:repo
          fi

      - id: generate-matrices
        name: Create output matrices
        run: |
          python ./.github/scripts/generate-build-matrices.py "$NX_BASE" Release

      - name: Delete unused files
        if: steps.generate-matrices.outputs.delete != ''
        run: |
          git rm ${{ steps.generate-matrices.outputs.delete }}
          git commit -m "Remove dead extensions [skip ci]"
          git push

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8f49b35e9d82000dcae1918b2133ba48d65a5c47 # v4.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31841fa899ec6aa86d7ba6ea # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > signingkey.jks
            echo "Keystore prepared"
          else
            echo "SIGNING_KEY secret not set, skipping keystore preparation"
          fi

      - name: Build extensions
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # API key secrets for sources
          ANILIST_API_KEY: ${{ secrets.ANILIST_API_KEY }}
          MEGA_API_KEY: ${{ secrets.MEGA_API_KEY }}
          MEGACLOUD_API: ${{ secrets.MEGACLOUD_API }}
          SHIRO_MAL_ID: ${{ secrets.SHIRO_MAL_ID }}
          SYNC_MAL_ID: ${{ secrets.SYNC_MAL_ID }}
          ALLANIME_API_URL: ${{ secrets.ALLANIME_API_URL }}
        run: |
          echo "Building chunk ${{ matrix.chunk.number }}: ${{ join(matrix.chunk.projects, ' ') }}"
          echo "IS_PR_CHECK=$IS_PR_CHECK"
          chmod +x ./gradlew
          ./gradlew ${{ join(matrix.chunk.projects, ' ') }} --stacktrace

      - name: Upload APKs
        if: github.repository == 'Sindrow33/ru-anime-extensions'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-apks
          path: '**/release/*.apk'
          retention-days: 1

      - name: Delete keystore
        run: rm -f signingkey.jks

  publish:
    name: Publish extension repo
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && github.repository == 'Sindrow33/ru-anime-extensions' && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: repo-apks
          path: repo/apk

      - name: Checkout ${{ github.ref_name }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.ref_name }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout repo branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: repo
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31841fa899ec6aa86d7ba6ea # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.x'

      - name: Install inspector
        run: |
          wget -q "https://github.com/aniyomiorg/inspector/releases/download/r0.2.0/inspector.jar"
          java -jar inspector.jar --help

      - name: Move APKs
        run: |
          python ${{ github.ref_name }}/.github/scripts/move-built-apks.py

      - name: Inspect APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          java -jar inspector.jar "repo/apk" "repo/apk" "eu.kanade.tachiyomi.extension"
          echo "signing SHA256:" $(keytool -printcert -file "META-INF/CERT.RSA" | grep -oP "(?<=SHA256:).*")

      - name: Create repo JSON
        run: |
          cd repo
          python ../${{ github.ref_name }}/.github/scripts/create-repo.py

      - name: Commit changes
        run: |
          cd repo
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "${{ needs.prepare.outputs.latestCommitMessage }}"
            git push
          else
            echo "No changes to commit"
          fi
